[tool.ruff]
required-version = "==0.14.1"
target-version = "py39"
line-length = 100
include = ["experiments/worm_uncertainty/*.py"]

[tool.ruff.lint]
# Basic syntax, ambiguous statements, and undefined names; no scientific rewrites.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
